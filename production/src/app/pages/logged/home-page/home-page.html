<div class="min-h-screen bg-[#0D0D0D] text-white flex">
    <div class="w-full md:w-80 lg:w-72 border-r border-[#161616] p-4 flex flex-col">
        <div class="flex items-center justify-between mb-12">
            <div class="w-14 h-12">
                <img src="../../../../vantalogo.png" class="w-full h-full fill-current" alt="">
            </div>
        </div>
        <app-side-bar (folderChange)="setFolder($event)" (createFolderRequest)="openFolderModal()" />
    </div>
    <div class="flex-1 p-6">
        <div class="flex justify-end items-center mb-8">
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 rounded-full py-1 px-3">
                    <!-- IMAGEM se for pasta padrão -->
                    <img *ngIf="isDefaultFolder(currentFolder)" id="imgMain"
                        [src]="'../../../../' + currentFolder + '.png'" class="w-6 h-6 rounded object-cover" />

                    <!-- AVATAR se for pasta criada -->
                    <div *ngIf="!isDefaultFolder(currentFolder)"
                        class="w-6 h-6 rounded-md flex items-center justify-center text-white font-bold"
                        [ngStyle]="{ 'background-color': getColorForFolder(currentFolder) }">
                        {{ currentFolder.charAt(0).toUpperCase() }}
                    </div>



                    <span id="pastaHeader" class="text-sm">{{ currentFolder }}</span>
                </div>
                <div
                    class="w-8 h-8 rounded-full bg-neutral-700 hover:bg-neutral-600 transition-colors cursor-pointer flex items-center justify-center">
                    <img src="../../../../userfoto.png" alt="">
                </div>
            </div>
        </div>
        <div class="flex items-center gap-4 mb-6">
            <div class="w-16 h-16 bg-white rounded-md overflow-hidden flex items-center justify-center">
                <!-- IMAGEM GRANDE (vou manter 16x16 igual seu código) -->
                <img *ngIf="isDefaultFolder(currentFolder)" id="imgHeader"
                    [src]="'../../../../' + currentFolder + '.png'" class="w-16 h-16 object-cover rounded-md" />

                <!-- AVATAR GRANDE -->
                <div *ngIf="!isDefaultFolder(currentFolder)"
                    class="w-16 h-16 rounded-md flex items-center justify-center text-white font-bold text-3xl"
                    [ngStyle]="{ 'background-color': getColorForFolder(currentFolder) }">
                    {{ currentFolder.charAt(0).toUpperCase() }}
                </div>

            </div>
            <div>
                <h1 id="title" class="text-xl font-bold">{{ currentFolder }}</h1>
                <div class="flex items-center gap-1 text-neutral-400 text-sm">
                    <span>{{ numberOfProjects }} {{ numberOfProjects == 1 ? 'project' : 'projects' }}</span>
                </div>
            </div>
        </div>
        <div class="border-t border-[#161616] mb-6"></div>
        <div class="mb-8">
            <div class="flex items-center mb-6">
                <span class="material-symbols Offerings-outlined mr-2"></span>
                <h2 class="text-lg">Seus projetos</h2>
            </div>
            <div id="projectsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
                <ng-container *ngIf="projects$ | async as projects">
                    <div *ngFor="let p of projects"
                        class="bg-neutral-800 py-10 rounded-md hover:bg-neutral-700 transition-colors flex items-center justify-center cursor-pointer"
                        (click)="goToProject(p)">
                        <div class="flex items-center justify-center flex-col">
                            <h3 class="font-bold">{{ p.name }}</h3>
                        </div>
                    </div>
                </ng-container>

                <div id="abrirModal" (click)="toggleProjectModal()"
                    class="bg-neutral-800 py-10 rounded-md hover:bg-neutral-700 transition-colors flex items-center justify-center cursor-pointer">
                    <span class="material-symbols-outlined text-4xl text-neutral-600">add</span>
                </div>
            </div>
        </div>
    </div>
</div>

<div [class]="showProjectModal ? '' : 'hidden'">
    <app-add-project-modal [showProjectModal]="showProjectModal" [folders]="folders" (closeModal)="toggleProjectModal()"
        (createdProject)="onProjectCreated($event)" />
</div>

<app-add-folder-modal *ngIf="showFolderModal" (close)="showFolderModal = false">>

</app-add-folder-modal>
